version: 2

models:
  - name: dim_product
    description: "Dimensão de produtos contendo o catálogo completo de itens, preços, atributos físicos e a hierarquia de categorias e subcategorias."
    columns:
      - name: product_id
        description: "Chave primária do produto."
        data_tests:
          - unique
          - not_null

      - name: product_name
        description: "Nome comercial do produto."
        data_tests:
          - not_null

      - name: product_number
        description: "Código identificador de catálogo ou SKU do produto."
        data_tests:
          - not_null

      - name: color
        description: "Cor do produto (ex: Black, Red, Silver)."

      - name: list_price
        description: "Preço de listagem/venda sugerido para o produto."
        data_tests:
          - not_null

      - name: standard_cost
        description: "Custo padrão de fabricação ou aquisição do produto."

      - name: product_line
        description: "Linha de produto (ex: R = Road, M = Mountain, T = Touring, S = Standard)."

      - name: class
        description: "Classe do produto (ex: H = High, M = Medium, L = Low)."

      - name: style
        description: "Estilo do produto (ex: U = Universal, M = Men's, W = Women's)."

      - name: size
        description: "Tamanho do produto (ex: S, M, L, 42, 58)."

      - name: weight
        description: "Peso do produto."

      - name: make_flag
        description: "Indicador booleano/flag se o produto é fabricado internamente (1) ou comprado (0)."
        data_tests:
          - not_null

      - name: finished_goods_flag
        description: "Indicador booleano/flag se o produto é um produto final vendável (1) ou item de montagem/matéria-prima (0)."
        data_tests:
          - not_null

      - name: product_subcategory_id
        description: "Chave estrangeira referente à subcategoria do produto."

      - name: subcategory_name
        description: "Nome da subcategoria do produto. Retorna 'No Subcategory' como fallback caso o produto não possua subcategoria."
        data_tests:
          - not_null

      - name: product_category_id
        description: "Chave estrangeira referente à categoria principal do produto."

      - name: category_name
        description: "Nome da categoria principal do produto. Retorna 'No Category' como fallback caso o produto não possua categoria."
        data_tests:
          - not_null

      - name: sell_start_date
        description: "Data em que o produto começou a ser comercializado."
        data_tests:
          - not_null

      - name: sell_end_date
        description: "Data de encerramento da comercialização do produto (nulo para produtos ativos)."

      - name: discontinued_date
        description: "Data em que o produto foi oficialmente descontinuado."

      - name: modified_date
        description: "Data da última atualização do registro na fonte de origem."